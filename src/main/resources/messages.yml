table-usage-remove: "&cUse &e/roulette remove <name>"
table-usage-set: "&cUse &e/roulette set <name> <setting> <value>&c. Settings: &f%settings%"
table-set-done: "&aTable &e%table%&a: &f%setting% &ais now &f%value%&a."
