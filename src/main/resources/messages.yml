table-left: "&7You left the table."
# Shown line by line when a player sits down. Use [] to show nothing.
table-sit-hint:
  - "&7Look at the felt: &eright-click &7puts your chip on the bet you aim at, &eleft-click &7takes one back."
  - "&eMouse wheel &7changes the chip, &eF &7opens the bet menu, &esneak &7to leave."

